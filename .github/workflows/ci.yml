name: CI

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v26
        with:
          nix_path: nixpkgs=channel:nixos-24.11

      - name: Setup Nix cache
        # Best-effort build cache: speeds up nix builds when it works, but
        # must never block CI. It has failed on every run since this
        # workflow was added (no CACHIX_AUTH_TOKEN secret is configured, or
        # the "nexus" cache doesn't exist), which was killing the whole job
        # before the actual checks below ever ran.
        continue-on-error: true
        uses: cachix/cachix-action@v14
        with:
          name: nexus
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          skipPush: ${{ github.event_name == 'pull_request' }}

      - name: Check flake
        run: nix flake check --show-trace

      - name: Run tests
        run: nix develop --command clojure -M:test

      - name: Build nexus-crypto library
        run: nix build .#nexus-crypto --print-build-logs

      - name: Build nexus-keygen
        run: nix build .#nexus-keygen --print-build-logs

      - name: Build nexus-client  
        run: nix build .#nexus-client --print-build-logs

      - name: Build nexus-server
        run: nix build .#nexus-server --print-build-logs

  lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v26
        with:
          nix_path: nixpkgs=channel:nixos-24.11

      - name: Run clj-kondo
        # clj-kondo exits 0 clean, 2 warnings-only, 3 errors found -- a bare
        # non-zero exit would fail the step on warnings alone. Only treat
        # exit 3 (actual errors) as a failure.
        run: |
          nix develop --command clojure -M:lint
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "clj-kondo reported warnings only (exit 2); not failing the build."
            exit 0
          fi
          exit "$code"
